version: "3"

services:

  runtime-setup:
    image: netty:default
    build:
      context: .
      dockerfile: Dockerfile.centos7

  common: &common
    image: netty:default
    depends_on: [runtime-setup]
    environment:
      - GPG_KEYNAME
      - GPG_PASSPHRASE
      - GPG_PRIVATE_KEY
      - MAVEN_OPTS
    volumes:
      - ~/.ssh:/root/.ssh
      - ~/.gnupg:/root/.gnupg
      - ~/.m2:/root/.m2
      - ..:/code
    working_dir: /code
    security_opt:
      - seccomp:unconfined

  build-leak:
    <<: *common
    command: /bin/bash -cl "./mvnw -B -ntp -Pleak clean install -Dio.netty.testsuite.badHost=netty.io -Dtcnative.classifier=linux-x86_64-fedora -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true"

  build:
    <<: *common
    environment:
      - MAVEN_OPTS
      - TEST_FILTER
      # GitHub sets CI=true; FastThreadLocalTest#testInternalThreadLocalMapExpand runs only when it is set.
      - CI
    # Link-local IPv6 on the container's eth0 so the IPv6 multicast tests find an interface.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    # Scoped to the epoll modules (-pl ... -am): the full reactor + testsuite-shading run
    # exceeds the CI step budget; the epoll native tests and netty-testsuite still run.
    # -Pboringssl (as upstream's build-boringssl-static service) so the BoringSSL-only SSL tests run.
    command: /bin/bash -cl "./mvnw -B -ntp -Pboringssl -pl transport-classes-epoll,transport-native-unix-common,transport-native-epoll -am clean install -Dio.netty.testsuite.badHost=netty.io -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true $${TEST_FILTER:+-Dtest=$$TEST_FILTER -Dsurefire.failIfNoSpecifiedTests=false}"

  deploy:
    <<: *common
    command: /bin/bash -cl "./mvnw -B -ntp clean deploy -DskipTests=true -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true"

  stage-snapshot:
    <<: *common
    volumes:
      - ~/.ssh:/root/.ssh
      - ~/.gnupg:/root/.gnupg
      - ~/.m2:/root/.m2
      - ~/local-staging:/root/local-staging
      - ..:/code
    command: /bin/bash -cl "./mvnw -B -ntp clean deploy -DaltDeploymentRepository=local-staging::default::file:///root/local-staging -DskipTests=true -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true"

  stage-release:
    <<: *common
    volumes:
      - ~/.ssh:/root/.ssh
      - ~/.m2:/root/.m2
      - ~/local-staging:/root/local-staging
      - ..:/code
    command: /bin/bash -cl "cat <(echo -e \"${GPG_PRIVATE_KEY}\") | gpg --batch --import && ./mvnw -B -ntp clean javadoc:jar package gpg:sign org.sonatype.central:central-publishing-maven-plugin:publish -DskipPublishing=true -DskipTests=true -Dgpg.passphrase=${GPG_PASSPHRASE} -Dgpg.keyname=${GPG_KEYNAME} -Dtcnative.classifier=linux-x86_64-fedora -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true"

  build-with-oio-testsuite:
    <<: *common
    command: /bin/bash -cl "./mvnw -B -ntp -Pboringssl clean install -Dio.netty.testsuite.includeOio=true -Dio.netty.testsuite.badHost=netty.io -Dxml.skip=true -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true"

  build-boringssl-static:
    <<: *common
    command: /bin/bash -cl "./mvnw -B -ntp -Pboringssl clean install -Dio.netty.testsuite.badHost=netty.io -Dxml.skip=true -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true"

  build-leak-boringssl-static:
    <<: *common
    command: /bin/bash -cl "./mvnw -B -ntp -Pboringssl,leak clean install -Dio.netty.testsuite.badHost=netty.io -Dxml.skip=true -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true"

  build-leak-pooled:
    <<: *common
    command: /bin/bash -cl "./mvnw -B -ntp -Pboringssl,leak clean install -Dio.netty.testsuite.badHost=netty.io -Dxml.skip=true -Dio.netty.allocator.type=pooled -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true"

  build-boringssl-snapshot:
    <<: *common
    command: /bin/bash -cl "./mvnw -B -ntp -pl handler -Pboringssl-snapshot clean package -Dxml.skip=true -Dtcnative.classifier=linux-x86_64"

  build-boringssl-static-jdk8-tests:
    <<: *common
    command: /bin/bash -cl "./mvnw -B -ntp -Pboringssl,jdk8-tests,\!testsuite-jpms clean install -Dio.netty.testsuite.badHost=netty.io -Dxml.skip=true -Drevapi.skip=true -Dcheckstyle.skip=true -Dforbiddenapis.skip=true -DtestJavaHome=/usr/lib/jvm/java-1.8.0-openjdk"

  shell:
    <<: *common
    entrypoint: /bin/bash
